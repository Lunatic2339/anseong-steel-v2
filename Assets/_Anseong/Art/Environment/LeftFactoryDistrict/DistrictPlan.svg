<svg xmlns="http://www.w3.org/2000/svg" width="1300" height="900" viewBox="0 0 1300 900"><rect width="1300" height="900" fill="#f5f3ed"/><style>text{font-family:Malgun Gothic,sans-serif;fill:#263238}.r{stroke:#5d6268;stroke-width:15;fill:none;stroke-linejoin:round}.dash{stroke:#e9d59b;stroke-width:1.5;stroke-dasharray:8 8;fill:none}</style><text x="40" y="45" font-size="25">왼쪽 공장 구역 — 도로·블록 배치 계획</text><text x="40" y="75" font-size="15">상단 = 후경(+Z) / 오른쪽 = 전투장·부두 방향(+X). 배치 시 기존 시설 외곽을 피하여 조정.</text><rect x="45" y="125" width="500" height="660" fill="#dbe2df"/><rect x="545" y="125" width="450" height="660" fill="#e0e5cc"/><rect x="1005" y="125" width="115" height="660" fill="#efddbd"/><rect x="1140" y="330" width="120" height="250" fill="#f3cccc"/><text x="1160" y="435" font-size="17">전투장</text><text x="1150" y="460" font-size="15">기존 유지</text><text x="65" y="115" font-size="19">직선성이 강한 구역 ≈50%</text><text x="560" y="115" font-size="19">곡선·45° 구역 ≈50%</text><text x="1018" y="160" font-size="15">기존 에셋</text><text x="1018" y="185" font-size="15">보존 구역</text><path class="r" d="M65 170H540 M65 325H540 M65 480H540 M65 635H540 M65 770H540 M90 135V785 M240 135V785 M390 135V785 M535 135V785"/><path class="dash" d="M65 170H540 M65 325H540 M65 480H540 M65 635H540 M90 135V785 M240 135V785 M390 135V785"/><path class="r" d="M600 785 L600 680 Q600 640 650 590 L770 470 Q800 440 800 400 L800 335 Q800 310 755 265 L700 210 Q680 190 680 135 M535 635H600 M535 480H630L745 365 M535 325H600L690 235 M800 470L920 350 Q950 315 950 260V135 M650 590L805 745H980 M800 400H990"/><path class="dash" d="M600 785 L600 680 Q600 640 650 590 L770 470 Q800 440 800 400 L800 335 Q800 310 755 265 L700 210 Q680 190 680 135 M650 590L805 745H980 M800 400H990"/><g fill="#9ba8ae" stroke="#54646d" stroke-width="2"><rect x="115" y="195" width="95" height="95"/><rect x="265" y="195" width="95" height="95"/><rect x="415" y="195" width="95" height="95"/><rect x="115" y="350" width="95" height="95"/><rect x="265" y="350" width="95" height="95"/><rect x="415" y="350" width="95" height="95"/><rect x="115" y="505" width="95" height="95"/><rect x="265" y="505" width="95" height="95"/><rect x="415" y="505" width="95" height="95"/><rect x="115" y="660" width="95" height="85"/><rect x="265" y="660" width="95" height="85"/><rect x="415" y="660" width="95" height="85"/><rect x="560" y="185" width="70" height="90" transform="rotate(-18 595 230)"/><rect x="700" y="300" width="65" height="90" transform="rotate(45 732 345)"/><rect x="850" y="180" width="65" height="90" transform="rotate(-12 882 225)"/><rect x="850" y="495" width="90" height="80" transform="rotate(45 895 535)"/><rect x="665" y="650" width="70" height="90" transform="rotate(45 700 695)"/><rect x="835" y="625" width="90" height="65" transform="rotate(-15 880 657)"/></g><text x="45" y="830" font-size="17">5종: 압연 생산동 / 제강 설비동 / 제선 설비 묶음 / 가스정제·집진 설비 / 펌프·압축기 보조동</text><text x="45" y="860" font-size="15">개념 계획도. 기존 배치와 도로에 대한 간섭 검사 후 최종 좌표·회전을 확정한다.</text></svg>
